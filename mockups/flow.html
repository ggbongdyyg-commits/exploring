<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#dedbd4;display:flex;align-items:flex-start;padding:30px;width:max-content;font:13px -apple-system,sans-serif;color:#555}img{width:390px;height:844px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.18)}figure{margin:0;width:390px}figcaption{margin-top:10px;text-align:center;line-height:1.5}.ar{width:90px;margin-top:400px;text-align:center;color:#8f8e8a}.ar b{display:block;font-size:26px;font-weight:300;color:#3a3a38}</style></head><body><figure><img src="png/08-empty.png"><figcaption>A 空列表：虚线圈加一句话和一个按钮，引导添加</figcaption></figure><div class="ar"><b>→</b>点添加</div><figure><img src="png/01-setup.png"><figcaption>B 新建：只填名称和目标日期</figcaption></figure><div class="ar"><b>→</b>点开始</div><figure><img src="png/09-first-pick.png"><figcaption>C 新建完直接进入详情，第一次打开该项目：选今天的心情</figcaption></figure><div class="ar"><b>→</b>选心情</div><figure><img src="png/02-main.png"><figcaption>D 选完（或跳过）：时钟滚到今天，色点格记下心情；当天再进该项目不再弹</figcaption></figure><div class="ar"><b>→</b>点左上返回</div><figure><img src="png/06-list.png"><figcaption>E 返回列表：想看哪个点哪个，进入时才弹它自己的心情</figcaption></figure><div class="ar"><b>→</b>点卡片后，笑脸在详情里</div><figure><img src="png/05-review.png"><figcaption>F 详情右上笑脸：回看这个项目的心情</figcaption></figure></body></html>
